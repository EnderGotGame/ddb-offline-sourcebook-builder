name: Update v0.8 documentation

on:
  push:
    paths:
      - .github/workflows/docs-v08.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update docs
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          r = r.replace('**v0.7.0**', '**v0.8.0**', 1)
          old = 'v0.7 adds generic structure-driven print polish across D&D Beyond sourcebooks and adventures. It improves spacing between discrete indexed entries, protects compact tables from awkward page splits, and applies more consistent heading spacing without adding book-specific logic.'
          new = 'v0.8 adds mixed modern/legacy D&D Beyond source-path support for adventure books and refines v0.7 pagination efficiency while keeping the exporter structure-driven and book-agnostic.'
          r = r.replace(old, new, 1)
          marker = '## v0.7 generic print polish\n'
          section = '\n'.join([
              '## v0.8 adventure compatibility and pagination efficiency',
              '',
              'v0.8 supports D&D Beyond books whose landing page uses `/sources/dnd/<slug>` while actual chapter pages still use `/sources/<slug>/...`. The builder treats both path forms as aliases for the same book instead of hard-coding individual adventure titles.',
              '',
              'Additional changes:',
              '',
              '- large generated indexes with 80+ entries print in two columns;',
              '- indexed-entry headings keep only one compact opening metadata line attached, reducing unnecessary whitespace;',
              '- artwork/credit grouping is less aggressive and maximum print image height is slightly reduced;',
              '- generic `Creatures`, `NPCs`, and `Sidekicks` headings can participate in reference discovery;',
              '- existing v0.5 duplicate prevention, v0.6 table reconstruction, and v0.7 entry spacing remain intact.',
              '',
              ''
          ])
          if marker in r and '## v0.8 adventure compatibility' not in r:
              r = r.replace(marker, section + marker, 1)
          r = r.replace('// @version      0.7.0', '// @version      0.8.0')
          readme.write_text(r, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text(encoding='utf-8')
          entry = '\n'.join([
              '## 0.8.0 - 2026-09-23',
              '',
              '### Fixed',
              '',
              '- Adventure/source discovery now accepts both modern `/sources/dnd/<slug>` and legacy `/sources/<slug>/...` paths for the same book.',
              '- Adventure books such as Shadow of the Dragon Queen no longer fail with `No sourcebook pages found` solely because their chapter URLs use the legacy route.',
              '',
              '### Changed',
              '',
              '- Large generated indexes with 80+ entries use a two-column print layout.',
              '- Indexed-entry keep-together behavior now protects only one compact opening line.',
              '- Artwork/credit grouping is less aggressive and image height is slightly reduced to cut sparse pages.',
              '- Reference-document spacing is slightly tighter while preserving visual separation.',
              '- Generic `Creatures`, `NPCs`, and `Sidekicks` headings are recognized as possible reference collections.',
              '',
              ''
          ])
          if '## 0.8.0 ' not in c:
              c = c.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog.write_text(c, encoding='utf-8')

          Path('.github/workflows/docs-v08.yml').unlink()
          PY
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: document v0.8 adventure compatibility"
          git push
